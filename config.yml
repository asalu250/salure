backend:
  name: git-gateway
  branch: main

media_folder: "content/images"
public_folder: "content/images"

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "site"
        label: "Site Content"
        file: "content/site.json"
        fields:
          - { label: "Agent Name", name: "agent_name", widget: "string" }
          - { label: "Brokerage Name", name: "brokerage", widget: "string" }
          - { label: "City / Region", name: "city_region", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Hero Intro Text", name: "hero_lead", widget: "text" }
          - label: "Stats"
            name: "stats"
            widget: "object"
            fields:
              - { label: "Homes Sold", name: "homes_sold", widget: "string" }
              - { label: "Years Experience", name: "years_experience", widget: "string" }
              - { label: "Avg. Days on Market", name: "avg_days_on_market", widget: "string" }
          - { label: "About / Bio", name: "about_bio", widget: "text" }
          - label: "About Badges"
            name: "about_badges"
            widget: "list"
            field: { label: "Badge", name: "badge", widget: "string" }
          - label: "Listings"
            name: "listings"
            widget: "list"
            fields:
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Neighborhood / City / State", name: "neighborhood", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Beds", name: "beds", widget: "string" }
              - { label: "Baths", name: "baths", widget: "string" }
              - { label: "Sqft", name: "sqft", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Client Name", name: "name", widget: "string" }
              - { label: "Client City", name: "city", widget: "string" }
